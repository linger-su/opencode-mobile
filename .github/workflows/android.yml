name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Auto increment version
      id: version
      run: |
        # 读取当前版本号
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | sed 's/.*= \([0-9]*\).*/\1/')
        
        echo "Current version: $VERSION_NAME ($VERSION_CODE)"
        
        # 递增 versionCode
        NEW_VERSION_CODE=$((VERSION_CODE + 1))
        
        # 解析版本号
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
        
        # 递增 PATCH，满10进位
        NEW_PATCH=$((PATCH + 1))
        if [ $NEW_PATCH -ge 10 ]; then
          NEW_PATCH=0
          NEW_MINOR=$((MINOR + 1))
          if [ $NEW_MINOR -ge 10 ]; then
            NEW_MINOR=0
            NEW_MAJOR=$((MAJOR + 1))
          else
            NEW_MINOR=$NEW_MINOR
            NEW_MAJOR=$MAJOR
          fi
        else
          NEW_MINOR=$MINOR
          NEW_MAJOR=$MAJOR
        fi
        
        NEW_VERSION_NAME="$NEW_MAJOR.$NEW_MINOR.$NEW_PATCH"
        
        # 更新 build.gradle.kts
        sed -i "s/versionCode = $VERSION_CODE/versionCode = $NEW_VERSION_CODE/" app/build.gradle.kts
        sed -i "s/versionName = \"$VERSION_NAME\"/versionName = \"$NEW_VERSION_NAME\"/" app/build.gradle.kts
        
        echo "New version: $NEW_VERSION_NAME ($NEW_VERSION_CODE)"
        echo "version_name=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$NEW_VERSION_CODE" >> $GITHUB_OUTPUT

    - name: Commit version update
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add app/build.gradle.kts
        git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version_name }}"
        git push

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/opencode-mobile-v${{ steps.version.outputs.version_name }}.apk

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: opencode-mobile-v${{ steps.version.outputs.version_name }}
        path: app/build/outputs/apk/debug/*.apk
